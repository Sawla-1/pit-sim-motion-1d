<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo-64.png" />
    <title>PIT Simulation</title>
    <!-- Start the first-screen pictures now, so they come with the app and not after it.
         The bamboo and the title sign are hidden on phones, so phones do not rush them. -->
    <link rel="preload" as="image" href="/karen-intro-svgs/scene-intro.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/boy-standing.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/boy-side-walking.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/bar-background-tall.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/drum-horns-empty.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/time-background.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/tab-background-short.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/bottom-background.svg" />
    <link rel="preload" as="image" href="/karen-intro-svgs/bamboo-left.svg" media="(min-width: 640px)" />
    <link rel="preload" as="image" href="/karen-intro-svgs/bamboo-right.svg" media="(min-width: 640px)" />
    <link rel="preload" as="image" href="/karen-intro-svgs/title-banner.svg" media="(min-width: 640px)" />
    <style>
      /* The page color from the first moment, so there is no white flash */
      body {
        margin: 0;
        background: #f5f9f3;
      }
      /* The loading screen. It is plain HTML inside #root, so it shows before any
         code has downloaded, and React replaces it by itself when the app starts.
         It waits 0.3 s before it shows: on a fast connection nobody sees it blink. */
      .app-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #4a2a12;
        opacity: 0;
        animation: app-loading-show 0.2s 0.3s forwards;
      }
      .app-loading-ring {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 5px solid #e8dcc0;
        border-top-color: #b4262d;
        animation: app-loading-spin 0.9s linear infinite;
      }
      @keyframes app-loading-show {
        to {
          opacity: 1;
        }
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* People who asked their device for less motion get a ring that stands still */
      @media (prefers-reduced-motion: reduce) {
        .app-loading-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--first-screen-start-->
      <div class="app-loading" role="status">
        <div class="app-loading-ring"></div>
        Loading…
      </div>
      <!--first-screen-end-->
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
